# Two vLLM processes, one H100 each. Apply after workers=0.
# Lives in task3-inference. Anti-affinity keeps base and LoRA off the
# same node so Nebius GPU series (green vs yellow VM) map 1:1 to a model.
# Service names are vllm-base / vllm-dolly (not "vllm") so kube does not
# inject VLLM_PORT. enableServiceLinks: false is the same belt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-base
  namespace: task3-inference
  labels:
    app: vllm-base
    demo: task-3
    model: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-base
  template:
    metadata:
      labels:
        app: vllm-base
        demo: task-3
        model: base
    spec:
      enableServiceLinks: false
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 30
      nodeSelector:
        slurm.nebius.ai/nodeset-name: worker
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  demo: task-3
              topologyKey: kubernetes.io/hostname
            - labelSelector:
                matchLabels:
                  slurm.nebius.ai/worker: "true"
              namespaces:
                - soperator
              topologyKey: kubernetes.io/hostname
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.10.2
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - Qwen/Qwen2.5-7B-Instruct
            - --served-model-name
            - qwen25-7b
            - --gpu-memory-utilization
            - "0.85"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --trust-remote-code
          env:
            - name: HF_HOME
              value: /mnt/data/nebius-demo/hf_cache
            - name: HUGGING_FACE_HUB_CACHE
              value: /mnt/data/nebius-demo/hf_cache
            - name: TRANSFORMERS_CACHE
              value: /mnt/data/nebius-demo/hf_cache
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "12"
              memory: 120Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jail-submount-data-base
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-base
  namespace: task3-inference
  labels:
    app: vllm-base
    demo: task-3
    model: base
spec:
  type: ClusterIP
  selector:
    app: vllm-base
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-dolly
  namespace: task3-inference
  labels:
    app: vllm-dolly
    demo: task-3
    model: dolly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-dolly
  template:
    metadata:
      labels:
        app: vllm-dolly
        demo: task-3
        model: dolly
    spec:
      enableServiceLinks: false
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 30
      nodeSelector:
        slurm.nebius.ai/nodeset-name: worker
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  demo: task-3
              topologyKey: kubernetes.io/hostname
            - labelSelector:
                matchLabels:
                  slurm.nebius.ai/worker: "true"
              namespaces:
                - soperator
              topologyKey: kubernetes.io/hostname
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.10.2
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - Qwen/Qwen2.5-7B-Instruct
            - --served-model-name
            - qwen25-7b
            - --enable-lora
            - --lora-modules
            - dolly=/mnt/data/nebius-demo/checkpoints/dolly-lora
            - --max-lora-rank
            - "64"
            - --gpu-memory-utilization
            - "0.85"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --trust-remote-code
          env:
            - name: HF_HOME
              value: /mnt/data/nebius-demo/hf_cache
            - name: HUGGING_FACE_HUB_CACHE
              value: /mnt/data/nebius-demo/hf_cache
            - name: TRANSFORMERS_CACHE
              value: /mnt/data/nebius-demo/hf_cache
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "12"
              memory: 120Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jail-submount-data-dolly
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-dolly
  namespace: task3-inference
  labels:
    app: vllm-dolly
    demo: task-3
    model: dolly
spec:
  type: ClusterIP
  selector:
    app: vllm-dolly
  ports:
    - name: http
      port: 8000
      targetPort: http
