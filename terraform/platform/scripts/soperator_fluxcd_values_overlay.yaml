# Merged by Flux as ConfigMap soperator-fluxcd-values (optional valuesFrom).
# The slurm module always waits up to 240m for HelmRelease
# flux-system-soperator-fluxcd-soperator-activechecks. That chart's install
# hook blocks on every ActiveCheck with spec.runAfterCreation=true.
# essential still leaves these two true; they need a working Slurm node
# list and a checks-controller status write, which this 1-GPU Ethernet
# lab does not finish during bootstrap. Disable run-after-create so the
# HelmRelease can go Ready. CronJobs remain for later manual runs.
soperatorActiveChecks:
  overrideValues:
    checks:
      ensure-healthy-nodes:
        runAfterCreation: false
      wait-for-soperatorchecks-srun-ready:
        runAfterCreation: false
