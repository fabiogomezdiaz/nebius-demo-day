# Public hostname for vLLM. DNS is out of band: A record → task2-ingress
# LoadBalancer IP. Controller: ./task-2/01-ingress.sh
# Ingress object is applied by ./task-2/02-serve.sh
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm
  namespace: task2-inference
  labels:
    app: vllm
    demo: task-2
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: quen-lora-dolly.fabiogomezdiaz.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vllm
                port:
                  number: 8000
